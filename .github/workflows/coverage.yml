name: Coverage

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    uses: ./.github/workflows/prepare-maven.yml

  other-tests:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: Configure Maven repositories
        run: install -D .github/maven-settings.xml "$HOME/.m2/settings.xml"
      - name: Restore prepared Maven repository
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: ${{ needs.prepare.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Build with Maven (excluding JarFileToJavaSourceTest)
        run: mvn "-Dtest=Test*,*Test,*Tests,*TestCase,!JarFileToJavaSourceTest" test jacoco:report --no-transfer-progress

      - name: Upload coverage to Codecov (other tests)
        uses: codecov/codecov-action@v7
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: other-tests
          name: other-tests

  jarfile-to-java-source-tests:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17]
        testMethod:
          - testBCEL
          - testCommonsIO
          - testCommonsCodec
          - testCommonsCollections4
          - testCommonsCompress
          - testCommonsCsv
          - testCommonsImaging
          - testCommonsLang3
          - testCommonsMath3
          - testCommonsNet
          - testCommonsText
          - testDiskLruCache
          - testGson
          - testJacksonCore
          - testJacksonDatabind
          - testGuavaAbstractFutureAndTesting
          - testGuavaConcurrentMathCacheAndGraph
          - testGuavaOthers
          - testJavaPoet
          - testJavaWriter
          - testJSoup
          - testJUnit4
          - testMimecraft
          - testScribe
          - testSparkCore
          - testLog4jApi
          - testLog4jCore
          - testJodaTime

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The build of the library (its parent pom, its plugins) is run with its own local repository: Maven Central answers 429 when all the jobs fill it at once
      - uses: actions/cache@v6.1.0
        with:
          path: target/m2-local
          key: ${{ runner.os }}-m2-local-${{ matrix.testMethod }}-${{ hashFiles('pom.xml', '.github/maven-settings.xml', '.github/workflows/prepare-maven.yml') }}
          restore-keys: |
            ${{ runner.os }}-m2-local-${{ matrix.testMethod }}-
      - name: Set up JDK 8 for Commons Math, Spark, Scribe and JavaPoet
        if: matrix.testMethod == 'testCommonsMath3' || matrix.testMethod == 'testSparkCore' || matrix.testMethod == 'testScribe' || matrix.testMethod == 'testJavaPoet'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 8
      - name: Remember JDK 8 home
        if: matrix.testMethod == 'testCommonsMath3' || matrix.testMethod == 'testSparkCore' || matrix.testMethod == 'testScribe' || matrix.testMethod == 'testJavaPoet'
        run: echo "JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          # Temurin 17.0.21 supports the SHAKE message digests: the tests of Commons Codec which expect them to be missing on JDK 17 fail with it.
          # The time zone tests of Commons Lang fail with it too since the end of the daylight saving time: they expect daylight names which it no longer gives.
          java-version: ${{ (matrix.testMethod == 'testCommonsCodec' || matrix.testMethod == 'testCommonsLang3') && '17.0.20' || matrix.java }}
      - name: Configure Maven repositories
        run: install -D .github/maven-settings.xml "$HOME/.m2/settings.xml"
      - name: Restore prepared Maven repository
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: ${{ needs.prepare.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Seed nested Maven repository from prepared dependencies
        shell: bash
        run: |
          mkdir -p target/m2-local
          rsync -a --ignore-existing \
            --exclude='*-SNAPSHOT/' \
            --exclude='*.lastUpdated' \
            --exclude='*.part' \
            --exclude='*.part.lock' \
            --exclude='maven-metadata-local.xml*' \
            --exclude='resolver-status.properties' \
            "$HOME/.m2/repository/" target/m2-local/
      - name: Build with Maven (JarFileToJavaSourceTest#${{ matrix.testMethod }})
        run: mvn "-Dtest=JarFileToJavaSourceTest#${{ matrix.testMethod }}" test jacoco:report --no-transfer-progress

      - name: Upload coverage to Codecov (JarFileToJavaSourceTest#${{ matrix.testMethod }})
        uses: codecov/codecov-action@v7
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: jarfile-to-java-source-tests
          name: JarFileToJavaSourceTest#${{ matrix.testMethod }}
